name: Keep database awake and back up entries

on:
  schedule:
    - cron: "17 13 * * *"   # every day, 13:17 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Ping Supabase and save entries
        run: node scripts/backup.mjs
      - name: Commit if anything changed
        run: |
          git config user.name "log-backup-bot"
          git config user.email "log-backup-bot@users.noreply.github.com"
          git add data/entries.json data/heartbeat.txt
          git diff --cached --quiet || git commit -m "Daily backup of entries"
          git push
